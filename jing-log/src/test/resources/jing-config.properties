jing.log.level=INFO
jing.log.handlers=[capture]
jing.log.batch.max=1024
jing.log.arena.size=16777216
jing.log.timezone=UTC
jing.log.ansi=true
jing.log.level.color=
jing.log.console.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
jing.log.console.err.level=WARN
jing.log.file.path=logs/jing.log
jing.log.file.rotation=off
jing.log.file.format=log
jing.log.file.flush=interval
jing.log.file.maxBackups=7
jing.log.file.maxAge=30